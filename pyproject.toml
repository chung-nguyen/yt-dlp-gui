[project]
name = "yt-dlp-gui"
version = "0.1.0"
description = "Small cross-platform GUI for yt-dlp, with a car-HUD MP4 preset."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2.2",
    "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11"]

[project.scripts]
yt-dlp-gui = "ytdlp_gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
